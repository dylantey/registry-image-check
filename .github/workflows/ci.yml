name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Test and Bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: npm ci

      - name: Type check
        run: npm run build

      - run: npm run test

      - run: npm run bundle

      - name: Ensure dist is up to date
        run: |
          # --porcelain also reports untracked files, which `git diff` would miss
          changes=$(git status --porcelain dist/)
          if [ -n "$changes" ]; then
            echo "$changes"
            echo "dist/ is out of date. Run 'npm run bundle' and commit the result."
            exit 1
          fi
