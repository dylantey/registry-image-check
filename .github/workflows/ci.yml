name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Test and Bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: npm ci

      - run: npm run test

      - run: npm run bundle

      - name: Ensure dist is up to date
        run: |
          git diff --exit-code dist/ || (echo "dist/ is out of date. Run 'npm run bundle' and commit the result." && exit 1)
