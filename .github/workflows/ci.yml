name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Test and Bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: npm ci

      - name: Type check
        run: npm run build

      - run: npm run test

      - run: npm run bundle

      - name: Ensure dist is up to date
        run: |
          # --porcelain also reports untracked files, which `git diff` would miss
          changes=$(git status --porcelain dist/)
          if [ -n "$changes" ]; then
            echo "$changes"
            echo "dist/ is out of date. Run 'npm run bundle' and commit the result."
            exit 1
          fi

  # Runs the bundled action from this checkout (uses: ./) against real registries.
  action-smoke:
    name: Smoke test action
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - name: Check existing image
        id: existing
        uses: ./
        with:
          image: docker.io/library/alpine:latest

      - name: Verify existing image
        run: |
          [[ "${{ steps.existing.outputs.exists }}" == "true" ]]
          [[ "${{ steps.existing.outputs.digest }}" == sha256:* ]]

      - name: Check missing image
        id: missing
        uses: ./
        with:
          image: public.ecr.aws/docker/library/nginx:definitely-not-real-12345
          fail-on-missing: false

      - name: Verify missing image
        run: |
          [[ "${{ steps.missing.outputs.exists }}" == "false" ]]

      # Expected to fail: the default fail-on-missing: true must fail the step.
      - name: Check missing image fails by default
        id: default-missing
        uses: ./
        continue-on-error: true
        with:
          image: public.ecr.aws/docker/library/nginx:definitely-not-real-12345

      - name: Verify default fails on missing image
        run: |
          [[ "${{ steps.default-missing.outcome }}" == "failure" ]]
